services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: rag_demo_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragdemo
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpass
    ports:
      - "5434:5432"
    volumes:
      - rag_demo_pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  rag_demo_pgdata:
