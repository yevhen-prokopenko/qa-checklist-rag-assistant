services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: rag_demo_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragdemo
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpass
    ports:
      - "5434:5432"
    volumes:
      - rag_demo_pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: rag_demo_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  rag_demo_pgdata:
  n8n_data:

