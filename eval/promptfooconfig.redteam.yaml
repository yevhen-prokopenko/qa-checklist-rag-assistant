# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "RAG Checklist Assistant Automated Red-Teaming & Security Evaluation"

targets:
  - id: "file://eval_provider.py"
    config:
      pythonExecutable: "/Users/eugeneprokopenko/Projects/rag_checklist/.venv/bin/python"

redteam:
  provider: "openai:gpt-4o-mini"
  purpose: >
    A QA Checklist Assistant for Jira that reviews WMS (Warehouse Management System) logistics tasks 
    and suggests missing edge cases (e.g. rollback, rerouting, inventory consistency, and audit logging) 
    based on past verified warehouse incidents.

  numTests: 2

  plugins:
    - system-prompt-override
    - prompt-extraction
    - hallucination
    - excessive-agency
    - sql-injection

  strategies:
    - jailbreak
    - prompt-injection
