# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: "RAG Checklist Assistant Evaluation (Full Jira Provenance View)"

prompts:
  - "Task: {{input_task}}"

providers:
  - id: "file://eval_provider.py"
    config:
      pythonExecutable: "/Users/eugeneprokopenko/Projects/rag_checklist/.venv/bin/python"

defaultTest:
  assert:
    - type: llm-rubric
      value: >
        The output is a complete Jira Checklist table with Provenance tags (🧑 Human and 🤖 AI).
        
        Evaluate the following criteria:
        1. Human items (🧑 Human) correctly preserve the tester's original draft: "{{tester_draft}}".
        2. AI items (🤖 AI) properly address and satisfy the expected criteria:
           {{expected_aspects}}
        3. If AI items are suggested, each has a meaningful rationale in the "Why / Reason" column citing past cases or best practices.
        4. The AI items do NOT duplicate the tester's original human items and strictly obey any "MUST NOT", "MUST REFUSE", or "MUST BE EMPTY" constraints listed in {{expected_aspects}}.

tests: datasets/golden_dataset.csv
